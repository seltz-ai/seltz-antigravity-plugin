name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Antigravity publishes no validator, so this checks the files the plugin ships.
      - name: Check manifest, MCP config and skills
        shell: python3 {0}
        run: |
          import json, pathlib, re, subprocess, sys
          from urllib.parse import urlparse

          errors = []
          root = pathlib.Path.cwd().resolve()
          loaded = {}

          def load(path):
              if path not in loaded:
                  try:
                      loaded[path] = json.loads(pathlib.Path(path).read_text())
                  except (OSError, ValueError) as e:
                      errors.append(f"{path}: {e}")
                      loaded[path] = None
              return loaded[path]

          tracked = subprocess.run(["git", "ls-files", "-z"], capture_output=True, text=True, check=True).stdout
          for path in filter(None, tracked.split("\0")):
              if path.endswith(".json"):
                  load(path)

          plugin = load("plugin.json") or {}
          for key in ("name", "version", "description"):
              if not isinstance(plugin.get(key), str) or not plugin[key].strip():
                  errors.append(f"plugin.json: {key} must be a non-empty string")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", str(plugin.get("version", ""))):
              errors.append("plugin.json: version must be MAJOR.MINOR.PATCH")
          if "logo" in plugin:
              logo = (root / str(plugin["logo"])).resolve()
              if not logo.is_relative_to(root) or not logo.is_file():
                  errors.append(f"plugin.json: logo {plugin['logo']} is not a file in this repository")

          config = load("mcp_config.json")
          servers = (config or {}).get("mcpServers") or {}
          if config is not None and not servers:
              errors.append("mcp_config.json: mcpServers is empty")
          for name, server in servers.items():
              url = urlparse(str(server.get("url") or server.get("serverUrl") or ""))
              if url.scheme != "https" or not url.hostname:
                  errors.append(f"mcp_config.json: {name} needs an https url or serverUrl with a host")

          # Reads single-line `key: value` frontmatter. It does not parse YAML.
          skill_dirs = sorted(p for p in pathlib.Path("skills").glob("*") if p.is_dir())
          if not skill_dirs:
              errors.append("skills/: no skill directories")
          for skill_dir in skill_dirs:
              skill = skill_dir / "SKILL.md"
              if not skill.is_file():
                  errors.append(f"{skill_dir}: no SKILL.md")
                  continue
              match = re.match(r"---\n(.*?)\n---\n", skill.read_text(), re.S)
              if not match:
                  errors.append(f"{skill}: missing --- frontmatter")
                  continue
              fields = {
                  key: value.strip().strip("\"'").strip()
                  for key, value in re.findall(r"^(\w+):[ \t]*(.*)$", match.group(1), re.M)
              }
              if fields.get("name") != skill_dir.name:
                  errors.append(f"{skill}: name is {fields.get('name')!r}, must be {skill_dir.name!r}")
              if not fields.get("description"):
                  errors.append(f"{skill}: description is empty")

          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)

  # Aggregating job the org rulesets require as the `ci` status check on main.
  ci:
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            exit 1
          fi
